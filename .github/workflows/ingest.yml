name: ingest
# Manual only. Downloads race sessions from OpenF1 (free historical tier), builds the clean tables and the
# coverage report, and commits manifests + reports (never raw or processed lap data).
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, e.g. 2023 or 2023-2025"
        required: true
        default: "2023-2025"
      rounds:
        description: "Rounds, e.g. 1-3 (empty = all)"
        required: false
        default: ""
      commit_reports:
        description: "Commit manifests and reports back to the repo"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      STINT_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Restore OpenF1 response cache and raw extracts
        uses: actions/cache@v4
        with:
          path: |
            .cache
            data/raw
          key: f1data-${{ github.run_id }}
          restore-keys: f1data-

      - name: Ingest and build
        env:
          SEASONS: ${{ inputs.seasons }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          if [ -n "$ROUNDS" ]; then
            python -m pipelines ingest --seasons "$SEASONS" --rounds "$ROUNDS" -v
          else
            python -m pipelines ingest --seasons "$SEASONS" -v
          fi
          python -m pipelines build --seasons 2023-2025

      - name: Upload processed tables (private to the repo, 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: processed-${{ github.run_id }}
          path: |
            data/processed
            data/reports
            data/manifests
          retention-days: 30

      - name: Commit manifests and reports
        if: ${{ inputs.commit_reports }}
        env:
          SEASONS: ${{ inputs.seasons }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests data/reports
          git diff --cached --quiet || git commit -m "data: ingest $SEASONS $ROUNDS"
          git push
