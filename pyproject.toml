[project]
name = "stint-theory"
version = "0.1.0"
description = "Research pipeline for Formula 1 lap-time, tyre and strategy modelling"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pandas>=2.1", "numpy>=1.26", "pyarrow>=15",
                "scikit-learn>=1.4", "xgboost>=2.0", "statsmodels>=0.14", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.setuptools]
packages = ["pipelines", "models"]
